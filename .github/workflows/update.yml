name: 라인업 수집

on:
  schedule:
    - cron: "*/10 * * * *"   # 10분마다
  workflow_dispatch:          # Actions 탭에서 수동 실행 가능

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 지난 경기 기록 캐시는 저장소에 커밋하지 않고 깃허브 캐시에 보관 (저장소가 불어나지 않게)
      - uses: actions/cache@v4
        with:
          path: cache
          key: lineup-cache-${{ github.run_id }}
          restore-keys: lineup-cache-

      - run: pip install requests

      - name: 수집 실행
        run: python collect.py

      - name: 결과 커밋
        run: |
          git config user.name "lineup-bot"
          git config user.email "actions@github.com"
          mkdir -p archive docs/data
          git add -A docs/data archive
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "data: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push
          fi
