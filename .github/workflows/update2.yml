name: 라인업 수집 (이어달리기)

on:
  schedule:
    # 한 번 실행이 5시간 20분 동안 10분 간격으로 돈다.
    # 예약은 '이어달리기'가 끊겼을 때를 위한 보조 장치라 1시간에 한 번이면 충분하다.
    - cron: "37 * * * *"
  workflow_run:                 # '이어달리기'가 끝나면 이쪽이 받는다
    workflows: ["라인업 수집"]
    types: [completed]
  workflow_dispatch:
    inputs:
      rounds:
        description: "몇 번 반복할지 — 그대로 두면 32번(약 5시간 20분, 10분 간격). 한 번만 확인하려면 1"
        required: false
        default: "32"

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    # 대기 중이던 실행이 취소된 걸로 다시 이어달리기가 돌지 않게 한다 (무한 반복 방지)
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 340      # 10분 간격 32번 + 여유 (깃허브 한도는 6시간)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 지난 경기 기록 캐시: 불러오기
      - uses: actions/cache/restore@v4
        with:
          path: cache
          key: lineup-cache-${{ github.run_id }}
          restore-keys: lineup-cache-

      - run: pip install requests

      - name: 수집 실행 (10분 간격 반복)
        env:
          ROUNDS: ${{ github.event.inputs.rounds || '32' }}
          LIMIT: "19200"        # 5시간 20분. 넘으면 멈추고 다음 실행이 이어받는다
        run: |
          git config user.name "lineup-bot"
          git config user.email "actions@github.com"
          START=$(date +%s)
          for i in $(seq 1 "$ROUNDS"); do
            LEFT=$(( (LIMIT - ($(date +%s) - START)) / 60 ))
            echo "===== $i/$ROUNDS 회차 ($(date -u '+%H:%M UTC') · 남은 시간 ${LEFT}분) ====="
            python collect.py || echo "이번 회차 실패 — 다음 회차에서 다시 시도"
            mkdir -p archive docs/data
            git add -A docs/data archive
            if git diff --cached --quiet; then
              echo "변경 없음"
            else
              git commit -m "data: $(date -u '+%Y-%m-%d %H:%M UTC')"
              for try in 1 2 3; do            # 다른 실행과 겹치면 다시 받아서 올린다
                git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
                if git push; then break; fi
                echo "올리기 실패 ($try/3) — 20초 뒤 다시"
                sleep 20
              done
            fi
            if [ $(( $(date +%s) - START )) -ge "$LIMIT" ]; then
              echo "시간이 다 되어 멈춥니다 (다음 실행이 이어받습니다)"
              break
            fi
            if [ "$i" -lt "$ROUNDS" ]; then
              sleep 540
            fi
          done

      # 받은 기록은 실행이 실패하거나 멈춰도 저장 (다음 실행에서 이어받기)
      - name: 캐시 저장
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache
          key: lineup-cache-${{ github.run_id }}
