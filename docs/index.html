<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0C0E0D">
<title>라인업 레이더</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0C0E0D; --panel:#151816; --deep:#050606; --line:#29302C; --track:#202522;
  --ink:#E9ECEA; --mute:#98A29B; --led:#FFB23E; --led-ink:#1A1204;
  --g1:#5CC8FF; --g15:#FFB23E; --g2:#FF6B5E; --g0:#6F7A73;
  --home:#FF8A4C; --away:#5CC8FF; --home-bar:#FF8A4C; --away-bar:#5CC8FF;
  --win:#3DDC84; --draw:#98A29B; --loss:#FF6B5E;
  --pitch:#0F1712; --pline:#2E3A33;
  --display:"Black Han Sans","Apple SD Gothic Neo",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5;-webkit-text-size-adjust:100%;word-break:keep-all;overflow-wrap:anywhere}
.wrap{max-width:520px;margin:0 auto;padding:16px 14px 56px}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--led);outline-offset:2px}
[hidden]{display:none!important}
.mono{font-family:var(--mono)}

/* 머리 */
.top{display:flex;justify-content:space-between;align-items:flex-end;padding:4px 2px 12px}
.brand{font-family:var(--mono);font-size:11px;color:var(--led);letter-spacing:2px}
.top h1{font-family:var(--display);font-weight:400;font-size:30px;line-height:1.1;margin:0}
.stamp-time{font-family:var(--mono);font-size:12px;color:var(--mute);text-align:right;line-height:1.5}


.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{border:1px solid var(--line);background:transparent;border-radius:6px;padding:8px 12px;font-size:13px;white-space:nowrap;cursor:pointer;min-height:36px}
.chips button[aria-pressed="true"]{background:var(--led);border-color:var(--led);color:var(--led-ink);font-weight:700}

.group{font-size:12px;color:var(--mute);font-weight:600;margin:14px 2px 8px;letter-spacing:.5px}
.card{display:flex;gap:8px;align-items:stretch;padding:12px 6px 12px 12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
.card.pinned{border-color:var(--led)}
.card .when{display:flex;flex-direction:column;justify-content:center;width:60px;flex:none;border-right:1px solid var(--line);padding-right:8px}
.card .when b{font-family:var(--mono);font-size:16px;font-weight:600;color:var(--led);white-space:nowrap;overflow-wrap:normal}
.card .when span{font-size:11px;color:var(--mute)}
.card .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;text-align:left;border:0;background:transparent;padding:0;cursor:pointer}
.meta{display:flex;gap:6px;align-items:center;font-size:11px;color:var(--mute);flex-wrap:wrap}
.live{color:var(--g2);font-weight:700}
.flag{display:inline-flex;flex:none;white-space:nowrap;gap:3px;align-items:center;color:var(--led-ink);background:var(--led);font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px}
.tm{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:15px;font-weight:600}
.tm span:first-child{word-break:keep-all;line-height:1.3}
.gr{font-family:var(--display);font-size:18px;flex:none}
.wait{font-family:var(--mono);font-size:11px;color:var(--mute);border:1px dashed var(--line);padding:2px 7px;border-radius:4px;flex:none}
.ins{font-size:12px;color:var(--mute);margin-top:2px}
.ins.on{color:var(--ink)}
.star{width:44px;min-height:44px;border:0;background:transparent;display:flex;align-items:flex-start;justify-content:center;padding-top:2px;cursor:pointer;flex:none}
.empty{color:var(--mute);text-align:center;padding:30px 0}

/* 상세 */
.bar-top{display:flex;align-items:center;gap:10px;padding:0 0 12px}
.iconbtn{width:44px;height:44px;border:1px solid var(--line);border-radius:10px;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.iconbtn.on{border-color:var(--led)}
.bar-top .m{flex:1;font-family:var(--mono);font-size:12px;color:var(--mute)}
.board{background:var(--deep);border:1px solid var(--line);border-radius:14px;padding:16px 14px 14px;margin-bottom:10px}
.vsrow{display:grid;grid-template-columns:minmax(0,1fr) 30px minmax(0,1fr);align-items:center;text-align:center}
.vsrow .n{font-size:14px;font-weight:600;word-break:keep-all;line-height:1.3}
.vsrow .g{font-family:var(--display);font-size:50px;line-height:1.05}
.vsrow .c{font-family:var(--mono);font-size:20px;color:var(--mute)}
.vsrow .rec{font-family:var(--mono);font-size:11px;color:var(--mute);margin-top:2px}
.gauges{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:10px}
.gauge .t{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--mute)}
.track{height:6px;background:var(--track);border-radius:3px;margin-top:4px;overflow:hidden}
.track i{display:block;height:100%;border-radius:3px}
.headline{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);display:flex;gap:8px;align-items:flex-start}
.headline b{font-size:15px;font-weight:700;color:var(--led);line-height:1.45;word-break:keep-all}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px}
.sec-h span:first-child{font-family:var(--mono);font-size:12px;letter-spacing:1.5px;color:var(--led)}
.sec-h span:last-child{font-size:11px;color:var(--mute);text-align:right}
.pt{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.pt:last-child{border-bottom:0}
.pt .no{font-family:var(--mono);font-size:12px;color:var(--led);width:18px;flex:none;padding-top:2px}
.pt b{display:block;font-size:14px;font-weight:600;line-height:1.4}
.pt small{font-size:12px;color:var(--mute)}

/* 경기장 */
.pitch{position:relative;width:100%;aspect-ratio:334/600;border:1px solid var(--pline);border-radius:8px;background:var(--pitch);overflow:hidden}
.pitch.half{aspect-ratio:334/420}
.pl{position:absolute;border:1px solid var(--pline);pointer-events:none}
.pl.mid{left:0;right:0;top:50%;height:0;border-width:1px 0 0 0}
.pl.circle{left:36%;width:28%;aspect-ratio:1;top:50%;transform:translateY(-50%);border-radius:50%}
.pl.boxb{left:22%;right:22%;bottom:-1px;height:12%;border-bottom:0}
.pl.boxt{left:22%;right:22%;top:-1px;height:12%;border-top:0}
.pitch.half .pl.circle{top:0}
.pitch.half .pl.mid{top:0}
.pitch.half .pl.boxb{height:16%}
.tlabel{position:absolute;font-family:var(--mono);font-size:10px;color:var(--mute)}
.dot{position:absolute;transform:translate(-50%,-50%);width:62px;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:transparent;padding:0;cursor:pointer}
.dot i{width:26px;height:26px;border:2px solid var(--rc);color:var(--rc);background:var(--bg);font-family:var(--mono);font-style:normal;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;border-radius:50%}
.dot.a i{border-radius:6px;background:#1B2320}
.dot b{font-size:10px;font-weight:600;white-space:nowrap;max-width:62px;overflow:hidden;text-overflow:ellipsis}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--mute);margin-top:8px}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;background:var(--c)}

/* 전력 비교 (가운데 기준 양쪽 막대: 자기 막대가 길수록 전력 온전) */
.pw-names{display:grid;grid-template-columns:1fr 1fr;font-size:12px;font-weight:700;margin-bottom:12px}
.pw-names span:first-child{color:var(--home)}
.pw-names span:last-child{color:var(--away);text-align:right}
.pw{display:grid;grid-template-columns:48px minmax(0,1fr) 76px minmax(0,1fr) 48px;gap:6px;align-items:center;margin-bottom:12px}
.pw b{font-family:var(--mono);font-size:15px;font-weight:600}
.pw b:first-child{text-align:right}
.pw b.hi{color:var(--led)}
.pw .k{font-size:12px;color:var(--mute);text-align:center;line-height:1.3}
.pw .bar{height:12px;background:var(--track);border-radius:3px;display:flex;overflow:hidden}
.pw .bar.l{justify-content:flex-end}
.pw .bar i{display:block;height:100%;border-radius:3px}
.pw .bar.l i{background:var(--home-bar)} .pw .bar.r i{background:var(--away-bar)}
.pw-form{display:grid;grid-template-columns:minmax(0,1fr) 76px minmax(0,1fr);gap:6px;align-items:center;margin-top:2px}
.pw-form .k{font-size:12px;color:var(--mute);text-align:center}
.mini{display:flex;gap:3px}
.mini.l{justify-content:flex-end}
.mini i{width:18px;height:18px;border-radius:3px;font-style:normal;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;color:var(--bg)}
.mini .W{background:var(--win)} .mini .D{background:var(--draw)} .mini .L{background:var(--loss)}

/* 작은 소제목 */
.sub{font-size:11px;font-weight:700;color:var(--mute);letter-spacing:1px;margin:16px 0 10px;padding-top:12px;border-top:1px dashed var(--line)}
.sub.first{border-top:0;padding-top:0;margin-top:4px}

/* 오늘 라인업 전력 */
.pw.wide{grid-template-columns:62px minmax(0,1fr) 76px minmax(0,1fr) 62px}
.pw.wide b{font-size:14px;white-space:nowrap}
.lp-share{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:8px;margin:4px 0 8px}
.lp-share .n{font-family:var(--mono);font-size:40px;font-weight:600;line-height:1}
.lp-share .n.h{color:var(--home)} .lp-share .n.a{color:var(--away);text-align:right}
.lp-share .t{font-size:12px;color:var(--mute);text-align:center;padding-bottom:6px}
.lp-split{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--track)}
.lp-split i{display:block;height:100%}
.lp-split .h{background:var(--home)} .lp-split .a{background:var(--away);flex:1}
.lp-verdict{font-size:17px;font-weight:700;margin-top:12px;color:var(--led)}
.lp-note{font-size:13px;margin-top:4px;line-height:1.5}
.lp-warn{font-size:11px;color:var(--mute);margin-top:6px}
.lp-top{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lp-top div{background:#0F1210;border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.lp-top small{display:block;font-size:11px;color:var(--mute)}
.lp-top b{display:block;font-size:15px;margin-top:2px;line-height:1.35}
.lp-top em{font-style:normal;font-family:var(--mono);color:var(--led);font-weight:700}
.lp-alert{font-size:12px;color:var(--loss);margin-top:8px;line-height:1.5}
.lines{display:grid;grid-template-columns:minmax(0,1fr) 92px minmax(0,1fr);gap:0;align-items:center;font-size:13px}
.lines > div{padding:8px 0;border-bottom:1px solid var(--line)}
.lines .v{font-family:var(--mono);font-size:15px;font-weight:600}
.lines .v.r{text-align:right}
.lines .v.hi{color:var(--led)}
.lines .k{text-align:center;color:var(--mute);font-size:12px;line-height:1.3}
.lines .k small{display:block;font-size:10px}
.board .pwline{margin-top:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--mute)}
.board .pwline b{font-family:var(--mono);font-size:14px;color:var(--ink)}
.board .pwline .v{color:var(--led);font-weight:700}
.pwvs{display:flex;align-items:baseline;gap:8px;margin-top:4px;font-family:var(--mono)}
.pwvs .k{font-family:var(--body);font-size:12px;color:var(--mute)}
.pwvs b{font-size:18px;font-weight:600;color:var(--ink)}
.pwvs b.hi{color:var(--led)}
.pwvs .vs{font-size:12px;color:var(--mute)}

/* 에이스 */
.aces{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ace{background:#0F1210;border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.ace.off{border-color:var(--g2)}
.ace .top{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--mute);padding:0}
.aceflag{font-size:11px;font-weight:700;color:#1A1204;background:#FFE066;padding:2px 6px;border-radius:4px;white-space:nowrap}
.acetag{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:1px;color:#1A1204;background:#FFE066;padding:1px 5px;border-radius:3px;white-space:nowrap}
.ace .nm{font-family:var(--display);font-size:24px;line-height:1.1;overflow-wrap:anywhere}
.ace .ps{font-family:var(--mono);font-size:11px;color:var(--mute)}
.ace .st{align-self:flex-start;font-size:12px;font-weight:700;padding:3px 8px;border-radius:5px}
.st.on{background:rgba(61,220,132,.16);color:var(--win)}
.st.bench{background:rgba(255,178,62,.18);color:var(--led)}
.st.out{background:rgba(255,107,94,.18);color:var(--loss)}
.ace .gr{display:grid;grid-template-columns:34px minmax(0,1fr);gap:4px 6px;font-size:12px;align-items:baseline}
.ace .gr span:nth-child(odd){color:var(--mute)}
.ace .gr span:nth-child(even){font-family:var(--mono);font-weight:600}
.ace .gr span.hot{color:var(--led)}
.ace-note{font-size:11px;color:var(--mute);margin-top:10px;line-height:1.5}
.ace-note b{color:var(--loss)}

/* 팀 전환 */
.switch{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
.switch button{min-height:44px;border-radius:10px;border:1px solid var(--line);background:transparent;font-weight:600;font-size:14px;cursor:pointer;word-break:keep-all}
.switch button[aria-pressed="true"]{border-color:var(--led);background:rgba(255,178,62,.12);color:var(--led);font-weight:700}

/* 빠진 주전 영향 */
.imp{display:grid;grid-template-columns:minmax(0,1fr) 66px 92px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.imp:last-of-type{border-bottom:0}
.imp .nm{display:flex;gap:6px;align-items:center;font-size:14px;font-weight:600;flex-wrap:wrap}
.tag{font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;color:var(--bg);white-space:nowrap}
.tag.bench{background:var(--led)} .tag.out{background:var(--g2)} .tag.core{background:transparent;color:var(--g1);padding:0}
.imp .ga{font-family:var(--mono);font-size:12px;color:var(--mute);text-align:right}
.imp .sh{display:flex;gap:6px;align-items:center}
.imp .sh .track{flex:1;margin:0}
.imp .sh span{font-family:var(--mono);font-size:11px;width:32px;text-align:right}
.note{font-size:11px;color:var(--mute);margin-top:8px;line-height:1.5}

/* 선수 표 (숫자 = 시즌 전체, 이름 아래 = 최근 분위기) */
.th,.pr > button{display:grid;grid-template-columns:minmax(0,1fr) 38px 56px 32px 32px;gap:4px;align-items:center}
.th{font-size:11px;color:#B8C0BA;font-weight:600;padding:0 2px 8px 16px;border-bottom:1px solid var(--line)}
.th span{text-align:center}
.th span:first-child{text-align:left}
.plist{list-style:none;margin:0;padding:0}
.pr{border-bottom:1px solid var(--line)}
.pr:last-child{border-bottom:0}
.pr:nth-child(even){background:rgba(255,255,255,.02)}
.pr.ace-row{background:rgba(255,224,102,.06)}
.pr > button{width:100%;border:0;background:transparent;padding:10px 2px 10px 0;text-align:left;cursor:pointer}
.pr.open{background:rgba(255,178,62,.07)}
.pcell{display:flex;gap:8px;align-items:flex-start;min-width:0}
.pd{width:8px;height:8px;border-radius:50%;background:var(--rc);flex:none;margin-top:7px}
.pn{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:15px;font-weight:600;line-height:1.3}
.pn small{font-family:var(--mono);font-size:10px;color:var(--mute);font-weight:500}
.pmood{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.chip{font-size:11px;font-weight:700;padding:2px 6px;border-radius:4px;white-space:nowrap}
.chip.up{background:rgba(61,220,132,.16);color:var(--win)}
.chip.down{background:rgba(255,107,94,.16);color:var(--loss)}
.chip.hot{background:rgba(255,178,62,.16);color:var(--led)}
.chip.steady{background:rgba(92,200,255,.14);color:var(--g1)}
.chip.mixed,.chip.few{background:rgba(152,162,155,.14);color:var(--mute)}
.l5{display:flex;gap:5px;align-items:center}
.c5{position:relative;width:17px;height:17px;border-radius:4px;box-sizing:border-box;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;line-height:1;flex:none}
.c5.st{background:#5CC8FF;border:1px solid #5CC8FF;color:#06202E}
.c5.sb{background:#FFB23E;border:1px solid #FFB23E;color:#2A1A00}
.c5.no{background:#2B1715;border:1px dashed #7A3A33;color:#C9675C}
.c5 .gp{position:absolute;top:-3px;right:-3px;width:7px;height:7px;border-radius:50%;background:#FFE066;border:1px solid var(--bg)}
.nu{font-family:var(--mono);font-size:15px;font-weight:600;text-align:center;color:var(--ink);font-variant-numeric:tabular-nums}
.nu.min{font-size:13px}
.nu.zero{color:#56605A;font-weight:500}
.nu .hit{display:inline-block;min-width:24px;padding:2px 0;border-radius:6px;background:var(--led);color:var(--led-ink);font-weight:700}
.guide{display:flex;flex-direction:column;gap:8px;font-size:12px;color:var(--mute)}
.guide .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.guide .cells{display:flex;gap:16px;flex-wrap:wrap;padding-bottom:10px;border-bottom:1px dashed var(--line)}
.guide .cells span{display:flex;gap:6px;align-items:center}
.log{padding:0 0 10px 13px}
.lr{display:grid;grid-template-columns:20px 1fr 48px;gap:8px;align-items:center;font-size:12px;margin-top:6px}
.lr b{width:20px;height:20px;border-radius:4px;color:var(--bg);font-size:10px;display:flex;align-items:center;justify-content:center}
.lr .W{background:var(--win)} .lr .D{background:var(--draw)} .lr .L{background:var(--loss)} .lr .x{background:#3A423D;color:var(--mute)}
.lr .track{height:8px;margin:0}
.lr .track i{background:var(--g1)} .lr .track i.s{background:var(--led)}
.lr span{font-family:var(--mono);text-align:right;color:var(--mute)}
.lr em{grid-column:2/4;font-style:normal;font-size:11px;color:var(--mute);margin-top:-4px}
.pitcher{font-size:14px;margin-top:10px}
.order{list-style:none;margin:0;padding:0}
.order li{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.order li:last-child{border-bottom:0}
.order .no{font-family:var(--mono);width:18px;color:var(--led)}
.order .ps{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--mute)}
.retry{border:1px solid var(--line);background:transparent;border-radius:10px;padding:10px 14px;cursor:pointer;min-height:44px}
.msg{color:var(--mute);font-size:14px;margin:14px 2px}
.foot{color:var(--mute);font-size:11px;margin-top:22px;line-height:1.7}
</style>
</head>
<body>
<main class="wrap">
  <section id="listView">
    <div class="top">
      <div><div class="brand">LINEUP RADAR</div><h1>오늘의 라인업</h1></div>
      <div class="stamp-time" id="updated">불러오는 중</div>
    </div>
    <div class="chips" id="chips" role="group" aria-label="보기"></div>
    <div id="list"></div>
    <p class="foot">대기 = 라인업 발표 전. 보통 경기 시작 1시간 전쯤 나오고, 나오면 등급이 켜집니다.<br>데이터: 축구·농구 ESPN 공개 피드, 야구 MLB 공식 Stats API.</p>
  </section>
  <section id="detailView" hidden></section>
</main>

<script>
(function(){
  const $ = (id) => document.getElementById(id);
  const el = (t, c, txt) => { const n = document.createElement(t); if (c) n.className = c; if (txt != null) n.textContent = String(txt); return n; };
  const svg = (markup) => { const d = document.createElement("span"); d.innerHTML = markup; return d.firstChild; };
  const fileOf = (key) => key.replace(/[^A-Za-z0-9._-]/g, "_") + ".json";
  const RANK = {"1군": 3, "1.5군": 2, "2군": 1};
  const GCOL = {"1군": "var(--g1)", "1.5군": "var(--g15)", "2군": "var(--g2)"};
  const RCOL = {"주전": "var(--g1)", "로테이션": "var(--led)", "백업": "#8A948D", "신규·복귀": "#5E6862", "불명": "#5E6862"};
  const RES = {W: "승", D: "무", L: "패"};
  // 받침 유무로 조사 고르기: josa("손흥민", "은", "는") -> "은"
  function josa(word, withFinal, without){
    const ch = String(word || "").slice(-1);
    if (ch >= "가" && ch <= "힣") return (ch.charCodeAt(0) - 0xAC00) % 28 ? withFinal : without;
    return /[lmnr0136789]/i.test(ch) ? withFinal : without;
  }
  const STAR = (on) => `<svg width="16" height="16" viewBox="0 0 24 24" fill="${on ? "#FFB23E" : "none"}" stroke="${on ? "#FFB23E" : "#98A29B"}" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>`;
  const BOLT = `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>`;
  const BACK = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E9ECEA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>`;

  let games = [];
  let filter = "전체";
  let NAT = false;   // 지금 보고 있는 경기가 A매치(국가대표)인지
  const SZ = () => NAT ? "대표팀" : "시즌";
  const SZN = (n) => NAT ? `대표팀 최근 ${n}경기` : `시즌 ${n}경기`;

  // 관심 경기 (이 폰에만 저장)
  const PIN_KEY = "lineup-radar-pins";
  function getPins(){ try { return new Set(JSON.parse(localStorage.getItem(PIN_KEY) || "[]")); } catch (e) { return new Set(); } }
  function togglePin(key){
    const p = getPins(); p.has(key) ? p.delete(key) : p.add(key);
    try { localStorage.setItem(PIN_KEY, JSON.stringify([...p].slice(-50))); } catch (e) {}
  }

  // 한국 시간
  function kst(iso){ const t = Date.parse(iso); if (isNaN(t)) return null; const d = new Date(t + 9 * 3600e3);
    return {y: d.getUTCFullYear(), m: d.getUTCMonth() + 1, d: d.getUTCDate(), h: d.getUTCHours(), mi: d.getUTCMinutes(), w: d.getUTCDay()}; }
  const hhmm = (iso) => { const k = iso && kst(iso); return k ? String(k.h).padStart(2,"0") + ":" + String(k.mi).padStart(2,"0") : "--:--"; };
  const md = (iso) => { const k = iso && kst(iso); return k ? `${k.m}/${k.d}` : ""; };
  function dayDiff(iso){ const k = kst(iso), n = kst(new Date().toISOString()); if (!k) return null;
    return Date.UTC(k.y, k.m - 1, k.d) / 864e5 - Date.UTC(n.y, n.m - 1, n.d) / 864e5; }
  function dayWord(iso){ const d = dayDiff(iso); return d === 0 ? "오늘" : d === 1 ? "내일" : d === -1 ? "어제" : md(iso); }
  function dayTitle(iso){ const k = kst(iso); if (!k) return "일정 미정"; return `${dayWord(iso)} · ${k.m}월 ${k.d}일 ${"일월화수목금토"[k.w]}요일`; }
  const announce = (iso) => { const t = Date.parse(iso); return isNaN(t) ? "" : hhmm(new Date(t - 3600e3).toISOString()); };
  // 전력 차 큼: 전력 비교가 있으면 그 숫자로(60 vs 40 이상 = '우위'), 없으면(야구 등) 등급 차이로
  const bigGap = (g) => {
    if (g.lineup_ready !== true) return false;
    if (g.power) return Math.abs(g.power[0] - g.power[1]) >= 20;
    return !!(RANK[g.grade_home] && RANK[g.grade_away]) && Math.abs(RANK[g.grade_home] - RANK[g.grade_away]) >= 1;
  };
  const shortName = (p) => { const s = p.short || p.name || ""; const parts = s.split(" "); return parts[parts.length - 1]; };

  async function getJSON(url){
    const res = await fetch(url + (url.includes("?") ? "&" : "?") + "t=" + Date.now());
    if (!res.ok) throw new Error(res.status);
    return res.json();
  }

  async function load(){
    try {
      const data = await getJSON("data/games.json");
      games = data.games || [];
      const k = kst(data.updated);
      $("updated").innerHTML = "";
      $("updated").append(el("div", null, k ? `${String(k.m).padStart(2,"0")}.${String(k.d).padStart(2,"0")} ${"SUN MON TUE WED THU FRI SAT".split(" ")[k.w]}` : ""), el("div", null, `갱신 ${hhmm(data.updated)}`));
      renderList();
    } catch (e) {
      $("updated").textContent = "불러오기 실패";
      $("list").textContent = "";
      $("list").append(el("p","empty","데이터를 불러오지 못했습니다. 잠시 후 다시 열어 주세요."));
    }
  }

  function renderList(){
    const pins = getPins();
    const sports = ["축구","야구","농구"].filter(s => games.some(g => g.sport === s));
    const hasNat = games.some(g => g.national);
    const opts = ["전체", `관심 ${[...pins].filter(k => games.some(g => g.key === k)).length}`, "전력 차 큼", ...(hasNat ? ["A매치"] : []), ...sports];
    const chips = $("chips"); chips.textContent = "";
    opts.forEach(o => {
      const id = o.startsWith("관심") ? "관심" : o;
      const b = el("button", null, o); b.type = "button";
      b.setAttribute("aria-pressed", String(filter === id));
      b.onclick = () => { filter = id; renderList(); };
      chips.append(b);
    });

    let rows = games;
    if (filter === "관심") rows = games.filter(g => pins.has(g.key));
    else if (filter === "전력 차 큼") rows = games.filter(bigGap);
    else if (filter === "A매치") rows = games.filter(g => g.national);
    else if (filter !== "전체") rows = games.filter(g => g.sport === filter);

    const box = $("list"); box.textContent = "";
    if (!rows.length){ box.append(el("p","empty", filter === "관심" ? "별표를 누르면 여기에 모입니다." : "표시할 경기가 없습니다.")); return; }
    const pinned = filter === "전체" ? rows.filter(g => pins.has(g.key)) : [];
    if (pinned.length){ box.append(el("div","group","관심 경기")); pinned.forEach(g => box.append(card(g, true))); }
    let last = null;
    rows.filter(g => !pinned.includes(g)).forEach(g => {
      const t = dayTitle(g.start_kst);
      if (t !== last){ box.append(el("div","group",t)); last = t; }
      box.append(card(g, pins.has(g.key)));
    });
  }

  function card(g, pinned){
    const c = el("div", "card" + (pinned ? " pinned" : ""));
    const w = el("div","when");
    w.append(el("b", null, hhmm(g.start_kst)), el("span", null, dayWord(g.start_kst)));
    c.append(w);
    const body = el("button","body"); body.type = "button";
    const meta = el("div","meta", g.league);
    if (g.state === "in") meta.append(el("span","live","LIVE"));
    if (g.state === "post") meta.append(el("span", null, "종료"));
    if (bigGap(g)){ const f = el("span","flag"); f.append(svg(BOLT), document.createTextNode("전력 차 큼")); meta.append(f); }
    body.append(meta);
    [["home","grade_home"],["away","grade_away"]].forEach(([s, gk]) => {
      const r = el("div","tm"); r.append(el("span", null, g[s]));
      if (g.lineup_ready === true && g[gk]){ const x = el("span","gr", g[gk]); x.style.color = GCOL[g[gk]] || "var(--g0)"; r.append(x); }
      else r.append(el("span","wait", g.lineup_ready === null || g.lineup_ready === undefined ? "확인" : "대기"));
      body.append(r);
    });
    if (g.lineup_ready === true){
      if (g.power){
        const [h, a] = g.power;
        const pr = el("div","pwvs");
        pr.append(el("span","k","전력"), el("b", h > a ? "hi" : null, h), el("span","vs","vs"), el("b", a > h ? "hi" : null, a));
        body.append(pr);
      }
    }
    else if (g.lineup_ready === null || g.lineup_ready === undefined) body.append(el("div","ins", "눌러서 라인업 확인"));
    else if (g.state !== "post") body.append(el("div","ins", `라인업 ${announce(g.start_kst)}쯤 발표`));
    body.onclick = () => openGame(g);
    c.append(body);
    const st = el("button","star"); st.type = "button";
    st.setAttribute("aria-label", pinned ? "관심 경기 해제" : "관심 경기로");
    st.setAttribute("aria-pressed", String(pinned));
    st.append(svg(STAR(pinned)));
    st.onclick = () => { togglePin(g.key); renderList(); };
    c.append(st);
    return c;
  }

  // ---------------------------------------------------------------- 상세
  async function openGame(g){
    const view = $("detailView");
    view.textContent = ""; view.hidden = false; $("listView").hidden = true;
    window.scrollTo(0, 0);

    const top = el("div","bar-top");
    const back = el("button","iconbtn"); back.type = "button"; back.setAttribute("aria-label","목록으로"); back.append(svg(BACK));
    back.onclick = () => { view.hidden = true; $("listView").hidden = false; renderList(); load(); };
    const m = el("div","m", `${g.league} · ${md(g.start_kst)} ${hhmm(g.start_kst)}`);
    if (g.state === "in"){ m.append(document.createTextNode(" · ")); m.append(el("span","live","LIVE")); }
    const pinned = getPins().has(g.key);
    const st = el("button","iconbtn" + (pinned ? " on" : "")); st.type = "button"; st.setAttribute("aria-label","관심 경기");
    st.setAttribute("aria-pressed", String(pinned));
    st.append(svg(STAR(pinned)));
    st.onclick = () => { togglePin(g.key); const on = getPins().has(g.key); st.textContent = ""; st.append(svg(STAR(on))); st.classList.toggle("on", on); st.setAttribute("aria-pressed", String(on)); };
    top.append(back, m, st);
    view.append(top);

    let d = null;
    try { d = await getJSON("data/games/" + fileOf(g.key)); } catch (e) { d = null; }
    if (view.hidden) return;
    NAT = !!(g.national || (d && d.national));

    const ready = d && d.lineup_ready;
    const T = ready ? d.teams : {};
    const bd = el("div","board");
    const vr = el("div","vsrow");
    ["home","away"].forEach((s, i) => {
      const col = el("div");
      col.append(el("div","n", g[s]));
      const sr = ready && T[s].season_record;
      if (sr && sr.matches) col.append(el("div","rec", `${NAT ? `최근 ${sr.matches}경기` : "시즌"} ${sr.w}승 ${sr.d}무 ${sr.l}패`));
      const gr = ready ? T[s].grade : "대기";
      const gx = el("div","g", gr); gx.style.color = ready ? (GCOL[gr] || "var(--g0)") : "var(--g0)";
      col.append(gx);
      vr.append(col);
      if (i === 0) vr.append(el("div","c",":"));
    });
    bd.append(vr);
    if (ready){
      const gs = el("div","gauges");
      ["home","away"].forEach(s => {
        const r = (T[s].strength || {}).retain;
        const box = el("div","gauge");
        const t = el("div","t"); t.append(el("span", null, `주전 ${T[s].core_in}/${T[s].size}`));
        const v = el("span", null, r == null ? "" : `전력 ${r}%`); v.style.color = GCOL[T[s].grade] || "var(--mute)"; t.append(v);
        const tr = el("div","track"); const f = el("i"); f.style.width = (r == null ? (T[s].core_in / (T[s].size || 1)) * 100 : r) + "%"; f.style.background = GCOL[T[s].grade] || "var(--g0)"; tr.append(f);
        box.append(t, tr); gs.append(box);
      });
      bd.append(gs);
      if (d.power){
        const pl = el("div","pwline");
        pl.append(el("span", null, "오늘 전력"), el("b", null, `${d.power.home} : ${d.power.away}`), el("span","v", d.power.verdict));
        bd.append(pl);
      }
      const sm = d.summary || {};
      if (sm.headline){
        const h = el("div","headline");
        const f = el("span","flag"); f.append(svg(BOLT), document.createTextNode("요약"));
        h.append(f, el("b", null, sm.headline));
        bd.append(h);
      }
    }
    view.append(bd);

    if (!ready){
      view.append(el("p","msg", (d && d.note) || `아직 선발 라인업이 나오지 않았습니다. ${announce(g.start_kst)}쯤 발표 예정입니다.`));
      const again = el("button","retry","다시 확인"); again.type = "button"; again.onclick = () => openGame(g);
      view.append(again);
      return;
    }

    const sm = d.summary || {};
    // 핵심 포인트는 양 팀 전광판 바로 아래
    if ((sm.points || []).length){
      const s = section("KEY POINTS");
      sm.points.forEach((p, i) => {
        const r = el("div","pt"); r.append(el("span","no", "0" + (i + 1)));
        const t = el("div"); t.append(el("b", null, p[0])); if (p[1]) t.append(el("small", null, p[1]));
        r.append(t); s.append(r);
      });
      view.append(s);
    }
    const lpc = lineupPowerCard(d, T, g);
    if (lpc) view.append(lpc);
    const ac = aceCard(T, g);
    if (ac) view.append(ac);

    if (g.sport === "축구" && (T.home.rows || []).length && (T.away.rows || []).length){
      const s = section("MATCH-UP", "● 홈 · ■ 원정");
      s.append(fullPitch(T.home, T.away, g));
      s.append(legend());
      view.append(s);
    }

    view.append(powerCard(T, g));

    const sw = el("div","switch");
    const body = el("div");
    const show = (side) => {
      [...sw.children].forEach(b => b.setAttribute("aria-pressed", String(b.dataset.side === side)));
      body.textContent = "";
      body.append(...teamParts(T[side], g, side));
    };
    ["home","away"].forEach(s => { const b = el("button", null, g[s]); b.type = "button"; b.dataset.side = s; b.onclick = () => show(s); sw.append(b); });
    view.append(sw, body);
    show(sm.focus || "home");
  }

  function section(title, extra){
    const s = el("div","sec");
    const h = el("div","sec-h"); h.append(el("span", null, title), el("span", null, extra || ""));
    s.append(h);
    return s;
  }

  function legend(){
    const lg = el("div","legend");
    ["주전","로테이션","백업","신규·복귀"].forEach(r => { const s = el("span", null, r); s.style.setProperty("--c", RCOL[r]); lg.append(s); });
    return lg;
  }

  function dot(p, x, y, side, idx){
    const b = el("button","dot" + (side === "away" ? " a" : "")); b.type = "button";
    b.style.left = x + "%"; b.style.top = y + "%";
    b.style.setProperty("--rc", RCOL[p.role] || "#5E6862");
    b.append(el("i", null, p.jersey || "·"), el("b", null, shortName(p)));
    b.setAttribute("aria-label", `${p.name} ${p.role}`);
    b.onclick = () => {
      const sw = document.querySelector(`.switch button[data-side="${side}"]`);
      if (sw && sw.getAttribute("aria-pressed") !== "true") sw.click();
      setTimeout(() => { const row = document.getElementById("p-" + idx); if (row){ const btn = row.querySelector("button"); if (!row.classList.contains("open")) btn.click(); row.scrollIntoView({behavior: "smooth", block: "center"}); } }, 30);
    };
    return b;
  }

  function fullPitch(H, A, g){
    const p = el("div","pitch");
    ["mid","circle","boxb","boxt"].forEach(k => p.append(el("div","pl " + k)));
    const lb = el("div","tlabel", `${g.home} ${H.formation || ""}`); lb.style.left = "8px"; lb.style.bottom = "6px";
    const lt = el("div","tlabel", `${g.away} ${A.formation || ""}`); lt.style.right = "8px"; lt.style.top = "6px";
    p.append(lb, lt);
    [[H, "home"], [A, "away"]].forEach(([t, side]) => {
      const rows = t.rows || [], nr = rows.length;
      rows.forEach((row, ri) => {
        const y = side === "home" ? 93 - ri * (36 / Math.max(1, nr - 1)) : 7 + ri * (36 / Math.max(1, nr - 1));
        row.forEach((idx, j) => {
          const pl = (t.players || [])[idx]; if (!pl) return;
          let x = ((j + 1) / (row.length + 1)) * 100;
          if (side === "away") x = 100 - x;
          p.append(dot(pl, x, y, side, idx));
        });
      });
    });
    return p;
  }

  function powerCard(T, g){
    const s = section("POWER CHECK", "막대가 길수록 전력 온전");
    const nm = el("div","pw-names"); nm.append(el("span", null, g.home), el("span", null, g.away));
    s.append(nm);
    const H = T.home.strength || {}, A = T.away.strength || {};
    const rows = [["주전 선발", Math.round(100 * T.home.core_in / (T.home.size || 1)), Math.round(100 * T.away.core_in / (T.away.size || 1)), `${T.home.core_in}/${T.home.size}`, `${T.away.core_in}/${T.away.size}`]];
    if (H.retain != null && A.retain != null) rows.push(["전력 보존율", H.retain, A.retain]);
    if (H.goal_share != null && A.goal_share != null) rows.push(["득점 지분", H.goal_share, A.goal_share]);
    if (H.assist_share != null && A.assist_share != null) rows.push(["도움 지분", H.assist_share, A.assist_share]);
    rows.forEach(([k, a, b, la, lb]) => {
      const r = el("div","pw");
      r.append(el("b", a > b ? "hi" : null, la || a + "%"));
      const l = el("div","bar l"); const li = el("i"); li.style.width = Math.min(100, a) + "%"; l.append(li);
      const rr = el("div","bar r"); const ri = el("i"); ri.style.width = Math.min(100, b) + "%"; rr.append(ri);
      r.append(l, el("span","k", k), rr, el("b", b > a ? "hi" : null, lb || b + "%"));
      s.append(r);
    });
    const hf = (T.home.form || []).slice(0, 5), af = (T.away.form || []).slice(0, 5);
    if (hf.length || af.length){
      const mini = (f, cls) => { const m = el("div","mini " + cls); f.forEach(x => { const i = el("i", x.res, RES[x.res] || "·"); i.title = `${x.gf ?? ""}:${x.ga ?? ""} ${x.opp || ""}`; m.append(i); }); return m; };
      const fr = el("div","pw-form");
      fr.append(mini(hf.slice().reverse(), "l"), el("span","k","최근 5경기"), mini(af, "r"));
      s.append(fr);
    }
    s.append(el("p","note","자기 쪽 막대가 길수록 평소 전력에 가까움 · 최근 5경기는 가운데 쪽이 최신"));
    return s;
  }

  // ---------------------------------------------------------------- 오늘 라인업 전력 (1군/2군과 별개로 두 팀을 같은 잣대에)
  function mirrorRow(k, a, b, la, lb, lowerBetter){
    const r = el("div","pw wide");
    const better = a == null || b == null ? 0 : (lowerBetter ? Math.sign(b - a) : Math.sign(a - b));
    const mx = Math.max(Math.abs(a || 0), Math.abs(b || 0)) || 1;
    r.append(el("b", better > 0 ? "hi" : null, la ?? (a ?? "-")));
    const l = el("div","bar l"); const li = el("i"); li.style.width = (a == null ? 0 : Math.max(4, 100 * a / mx)) + "%"; l.append(li);
    const rr = el("div","bar r"); const ri = el("i"); ri.style.width = (b == null ? 0 : Math.max(4, 100 * b / mx)) + "%"; rr.append(ri);

  // 최근 분위기: 선수마다 하나 (우선순위 순)
  function mood(p, sport){
    const log = (p.log || []).slice(0, 5);
    const apps = log.filter(m => m.played).length, starts = log.filter(m => m.started).length;
    const ap3 = log.slice(0, 3).reduce((n, m) => n + (m.g || 0) + (m.a || 0), 0);
    if (p.trend === "up") return ["▲ 상승세", "up"];
    if (p.trend === "down") return ["▼ 하락세", "down"];
    if (sport === "축구" && ap3 >= 2) return ["● 공격 감각", "hot"];
    if (log.length && apps <= 1) return ["○ 출전 적음", "few"];
    if (starts >= 4) return ["━ 꾸준", "steady"];
    return ["◐ 들쭉날쭉", "mixed"];
  }

  // 최근 5경기 칸: 선발 / 교체 / 미출전 (오른쪽이 최신)
  function last5(p){
    const box = el("span","l5"); box.setAttribute("aria-label","최근 5경기 출전");
    (p.log || []).slice(0, 5).reverse().forEach(m => {
      const c = el("span", "c5 " + (!m.played ? "no" : m.started ? "st" : "sb"), !m.played ? "–" : m.started ? "선" : "교");
      if (m.played && ((m.g || 0) + (m.a || 0))) c.append(el("span","gp"));
      c.title = `${md(m.date)} ${m.opp || ""} · ${!m.played ? "미출전" : (m.started ? "선발" : "교체") + (m.min != null ? " " + m.min + "분" : "")}${(m.g || m.a) ? ` · ${m.g || 0}골 ${m.a || 0}도움` : ""}`;
      box.append(c);
    });
    return box;
  }

  function labelsOf(t, sport){

  function teamParts(t, g, side){
    const out = [];
    const sport = g.sport;
    const [gl, al] = labelsOf(t, sport);

    if (t.pitcher){
      const p = t.pitcher, bits = [];
      if (p.starts != null) bits.push(`시즌 ${p.starts}선발`);

      s.append(el("div","pitcher", p.name + (bits.length ? " · " + bits.join(" · ") : "")));
      out.push(s);
    }

    // 팀 기록 1위
    const L = t.leaders || {};
    if (sport === "야구" && ((L.goals || []).length || (L.assists || []).length)){
      const s = section("TEAM LEADERS", `이번 시즌${sport === "야구" ? "" : ` · ${L.matches || 0}경기`}`);
      [[L.goals, gl], [L.assists, al]].forEach(([list, lab]) => {

      });
      out.push(s);
    }

    // 빠진 주전 영향
    const miss = [...(t.missing || [])].sort((a, b) => ((b.goals || 0) * 2 + (b.assists || 0)) - ((a.goals || 0) * 2 + (a.assists || 0)) || (b.starts || 0) - (a.starts || 0));
    if (miss.length){
      const tg = (t.strength || {}).team_goals || 0;

      miss.forEach(m => {
        const r = el("div","imp");
        const nm = el("div","nm", m.name || "이름 없음");

      });
      if (tg) s.append(el("p","note", `골·도움과 막대는 ${NAT ? "대표팀 최근 기록" : "이번 시즌"} 기준 (팀 ${gl} ${tg} 중 그 선수 비중)`));

    [["st","선","선발"],["sb","교","교체"],["no","–","미출전"]].forEach(([c, t, l]) => { const x = el("span"); x.append(el("span","c5 " + c, t), document.createTextNode(l)); cells.append(x); });
    const pt = el("span"); const pc = el("span","c5 st","선"); pc.append(el("span","gp")); pt.append(pc, document.createTextNode("골·도움")); cells.append(pt);
    g.append(cells, el("div", null, "최근 5경기, 오른쪽이 가장 최근 · 칸을 누르고 있으면 상대·출전시간이 보여요"));
    const rows = [["up","▲ 상승세",`${SZ()} 기록보다 최근 선발이 크게 늘어남`],["down","▼ 하락세",`${SZ()} 기록보다 최근 선발이 크게 줄어듦`]];
    if (sport === "축구") rows.push(["hot","● 공격 감각","최근 3경기 골+도움 2개 이상"]);
    rows.push(["steady","━ 꾸준","최근 5경기 중 4경기 이상 선발"]);
    rows.forEach(([c, l, d]) => { const r = el("div","row"); r.append(el("span","chip " + c, l), document.createTextNode(d)); g.append(r); });
    const r = el("div","row"); r.append(el("span","chip mixed","◐ 들쭉날쭉"), el("span","chip few","○ 출전 적음")); g.append(r);
    g.append(el("div", null, NAT ? "숫자(출전·시간·골·도움)는 대표팀 최근 A매치 기준 (친선·예선·본선 합산)" : "숫자(출전·시간·골·도움)는 이번 시즌 리그 전체 기준"));
    s.append(g);
    return s;
  }

  load();
})();
